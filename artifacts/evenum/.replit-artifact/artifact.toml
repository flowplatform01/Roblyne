kind = "web"
previewPath = "/"
title = "Evenum"
version = "1.0.0"
id = "artifacts/evenum"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22244

[services.development]
run = "pnpm --filter @workspace/evenum run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/evenum", "run", "build" ]
serve = "static"
publicDir = "artifacts/evenum/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22244"
BASE_PATH = "/"
