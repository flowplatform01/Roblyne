kind = "web"
previewPath = "/"
title = "ROBYNE"
version = "1.0.0"
id = "artifacts/evenum"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22244

[services.development]
run = "pnpm --filter @workspace/evenum run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/evenum", "run", "build" ]

[services.production.run]
args = [ "node", "artifacts/evenum/server.mjs" ]

[services.production.run.env]
NODE_ENV = "production"
PORT = "22244"
BASE_PATH = "/"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22244"
BASE_PATH = "/"
