        status:
          type: string
          enum: [pending_settlement, ready, released, completed]
        transactionCount:
          type: integer
        payoutMethod:
          type: ["string", "null"]
          description: Payout rail selected by the organization
        payoutAccount:
          type: ["string", "null"]
          description: Account identifier for the selected payout rail
        notes:
          type: ["string", "null"]
        releasedAt:
          type: ["string", "null"]
          format: date-time
        completedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    RequestWithdrawalInput:
      type: object
      required: [amount, payoutMethod, payoutAccount]
      properties:
        amount:
          type: number
          minimum: 0.01
          maximum: 9999999999.99
          multipleOf: 0.01
          description: Amount to withdraw from the available balance in the selected currency.
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: Optional for older clients; required when withdrawing from an organization with multiple available currencies.
        payoutMethod:
          type: string
          enum: [bank_transfer, mobile_money]
        payoutAccount:
          type: string
          minLength: 3
          maxLength: 160
        notes:
          type: ["string", "null"]
          maxLength: 500

    CommissionConfig:
      type: object
      required: [id, pillar, rate, currency, isActive, updatedAt]
      properties:
        id:
          type: integer
        pillar:
          type: string
          enum: [global, event, election, campaign]
        rate:
          type: number
          description: Commission rate as a decimal fraction (e.g. 0.05 = 5%)
        currency:
          type: string
        isActive:
          type: integer
        updatedAt:
          type: string
          format: date-time

    CommissionConfigUpdate:
      type: object
      properties:
        rate:
          type: number
          minimum: 0
          maximum: 1
          description: Commission rate as a decimal fraction (e.g. 0.05 = 5%)
        isActive:
          type: boolean

    OrgFinanceSummary:
      type: object
      required: [orgId, transactionCount, balancesByCurrency, byPillar, recentSettlements]
      properties:
        orgId:
          type: integer
        currency:
          type: ["string", "null"]
          description: Set only when all summary amounts have one unambiguous currency.
        totalRevenue:
          type: ["number", "null"]
        totalCommissionPaid:
          type: ["number", "null"]
        totalOrgEarnings:
          type: ["number", "null"]
        pendingBalance:
          type: ["number", "null"]
        releasedBalance:
          type: ["number", "null"]
        transactionCount:
          type: integer
        balancesByCurrency:
          type: array
          items:
            type: object
            required: [currency, totalRevenue, totalCommissionPaid, totalOrgEarnings, availableBalance, pendingSettlementBalance, releasedBalance, transactionCount]
            properties:
              currency:
                type: string
              totalRevenue:
                type: number
              totalCommissionPaid:
                type: number
              totalOrgEarnings:
                type: number
              availableBalance:
                type: number
              pendingSettlementBalance:
                type: number
              releasedBalance:
                type: number
              transactionCount:
                type: integer
        byPillar:
          type: array
          items:
            type: object
            required: [pillar, currency, revenue, earnings, count]
            properties:
              pillar:
                type: string
              currency:
                type: string
              revenue:
                type: number
              earnings:
                type: number
              count:
                type: integer
        recentSettlements:
          type: array
          items:
            $ref: "#/components/schemas/Settlement"

    TransactionList:
      type: object
      required: [total, transactions]
      properties:
        total:
          type: integer
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/FinancialTransaction"

    AdminFinanceStats:
      type: object
      properties:
        currency:
          type: ["string", "null"]
          description: Set only when all platform amounts have one unambiguous currency.
        total_platform_revenue:
          type: ["number", "null"]
        total_commission_collected:
          type: ["number", "null"]
        total_org_earnings:
          type: ["number", "null"]
        revenue_today:
          type: ["number", "null"]
        revenue_this_week:
          type: ["number", "null"]
        revenue_this_month:
          type: ["number", "null"]
        total_transactions:
          type: integer
        orgs_with_revenue:
          type: integer
        byCurrency:
          type: array
          items:
            type: object
            required: [currency, total_platform_revenue, total_commission_collected, total_org_earnings, revenue_today, revenue_this_week, revenue_this_month]
            properties:
              currency:
                type: string
              total_platform_revenue:
                type: number
              total_commission_collected:
                type: number
              total_org_earnings:
                type: number
              revenue_today:
                type: number
              revenue_this_week:
                type: number
              revenue_this_month:
                type: number
        byPillar:
          type: array
          items:
            type: object
            required: [pillar, currency, revenue, commission, count]
            properties:
              pillar:
                type: string
              currency:
                type: string
              revenue:
                type: number
              commission:
                type: number
              count:
                type: integer
        pendingSettlements:
          type: array
          items:
            type: object
            required: [currency, count, total_amount]
            properties:
              currency:
                type: string
              count:
                type: integer
              total_amount:
                type: number
        revenueByDay:
          type: array
          items:
            type: object
            required: [date, currency, revenue, count]
            properties:
              date:
                type: string
              currency:
                type: string
              revenue:
                type: number
              count:
                type: integer

    OrgBalance:
      type: object
      properties:
        org_id:
          type: integer
        org_name:
          type: string
        currency:
          type: string
        total_revenue:
          type: number
        total_commission:
          type: number
        total_earnings:
          type: number
        available_balance:
          type: number
        pending_settlement_balance:
          type: number
        released_balance:
          type: number
        transaction_count:
          type: integer

    OrgAnalytics:
      type: object
      properties:
        elections:
          type: array
          items:
            type: object
            additionalProperties: true
        events:
          type: array
          items:
            type: object
            additionalProperties: true
        campaigns:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              currency:
                type: string
                pattern: "^[A-Z]{3}$"

    CreateSettlementInput:
      type: object
      required: [orgId]
      properties:
        orgId:
          type: integer
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          description: Optional for older clients; required when the organization has multiple available currencies.

    UpdateSettlementInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending_settlement, ready, released, completed]
