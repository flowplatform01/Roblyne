  # ── DISCOVERY ─────────────────────────────────────────────────────────────
  /discover:
    get:
      operationId: discover
      tags: [discover]
      summary: Discover public content across all engines
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [all, elections, events, campaigns]
        - name: limit
          in: query
          schema:
            type: integer
            default: 24
        - name: sort
          in: query
          schema:
            type: string
            enum: [newest, trending, popular]
            default: newest
      responses:
        "200":
          description: Discovery feed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiscoveryFeed"

  /search:
    get:
      operationId: search
      tags: [discover]
      summary: Search public content
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [all, elections, events, campaigns, organizations]
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"

  /payments/{paymentId}:
    get:
      operationId: getPaymentStatus
      tags: [payments]
      summary: Get payment status with its unguessable status token
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
        - name: statusToken
          in: query
          required: true
          schema:
            type: string
            minLength: 32
      responses:
        "200":
          description: Payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatus"
        "404":
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: simulateDevelopmentPayment
      tags: [payments]
      summary: Advance a development-only simulated payment
      description: This endpoint is disabled outside non-production simulation mode.
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentSimulation"
      responses:
        "200":
          description: Updated simulated payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentStatus"
        "400":
          description: Invalid simulator request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Payment attempt not found or simulator disabled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    # ── SHARED ───────────────────────────────────────────────────────────────
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ClientDiagnosticInput:
      type: object
      required: [event, message]
      additionalProperties: false
      properties:
        event:
          type: string
          enum: [error, unhandledrejection]
        message:
          type: string
          minLength: 1
          maxLength: 8000
        stack:
          type: [string, "null"]
          maxLength: 8000
        componentStack:
          type: [string, "null"]
          maxLength: 8000
        route:
          type: [string, "null"]
          maxLength: 8000

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        requestId:
          type: [string, "null"]

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    PaymentInitialization:
      type: object
      required: [paymentRequired, paymentId, paymentStatus, statusToken]
      properties:
        paymentRequired:
          type: boolean
          enum: [true]
        paymentId:
          type: integer
        paymentStatus:
          type: string
          enum: [pending, processing, succeeded, failed]
        statusToken:
          type: string
          minLength: 32
        checkoutUrl:
          type: ["string", "null"]

    PaymentStatus:
      type: object
      required: [id, status, paymentStatus]
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [initializing, pending, processing, succeeded, failed]
        paymentStatus:
          type: string
          enum: [pending, processing, succeeded, failed]
        checkoutUrl:
          type: ["string", "null"]
        result:
          type: [object, "null"]
          properties:
            message:
              type: string
            ticketCode:
              type: string
            ticketTypeName:
              type: string

    PaymentSimulation:
      type: object
      required: [token, status]
      properties:
        token:
          type: string
          minLength: 32
        status:
          type: string
          enum: [pending, processing, succeeded, failed, cancelled]

    # ── AUTH ─────────────────────────────────────────────────────────────────
    AuthUser:
      type: object
      required: [id, email, name, createdAt]
      properties:
        id:
          type: integer
        email:
          type: string
        name:
          type: string
        avatarUrl:
          type: ["string", "null"]
        isPlatformAdmin:
          type: boolean
          description: Whether this user has platform-level admin privileges
        createdAt:
          type: string
          format: date-time

    RegisterInput:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
        name:
          type: string
          minLength: 1

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string

        password:
          type: string

    # ── ORGANIZATIONS ────────────────────────────────────────────────────────
    Organization:
      type: object
      required: [id, name, slug, ownerId, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        coverImageUrl:
          type: ["string", "null"]
        heroImageUrl:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        accentColor:
          type: ["string", "null"]
          description: Hex color e.g. "#4F46E5"
        theme:
          type: string
          enum: [evenum, light, dark]
          default: evenum
        ownerId:
          type: integer
        createdAt:
          type: string
          format: date-time

    PublicOrganization:
      type: object
      required: [id, name, slug, createdAt, stats]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        description:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        coverImageUrl:
          type: ["string", "null"]
        heroImageUrl:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        accentColor:
          type: ["string", "null"]
        theme:
          type: string
          enum: [evenum, light, dark]
        createdAt:
          type: string
          format: date-time
        stats:
          $ref: "#/components/schemas/OrganizationStats"
        recentElections:
          type: array
          items:
            $ref: "#/components/schemas/Election"
        recentEvents:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        recentCampaigns:
          type: array
          items:
            $ref: "#/components/schemas/Campaign"

    OrganizationInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        logoUrl:
          type: string
        coverImageUrl:
          type: string
        heroImageUrl:
          type: string
        website:
          type: string
        accentColor:
          type: string
        theme:
          type: string
          enum: [evenum, light, dark]

    OrganizationUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        logoUrl:
          type: string
        coverImageUrl:
          type: string
        heroImageUrl:
          type: string
        website:
          type: string
        accentColor:
          type: string
        theme:
          type: string
          enum: [evenum, light, dark]

    OrganizationStats:
      type: object
      required: [electionsCount, eventsCount, campaignsCount, totalParticipants]
      properties:
        electionsCount:
          type: integer
        eventsCount:
          type: integer
        campaignsCount:
          type: integer
        totalParticipants:
          type: integer
        activeElectionsCount:
          type: integer
        upcomingEventsCount:
          type: integer
        activeCampaignsCount:
          type: integer

    # ── ELECTIONS ────────────────────────────────────────────────────────────
    Election:
      type: object
      required: [id, orgId, title, status, visibility, createdAt]
      properties:
        id:
          type: integer
        orgId:
          type: integer
        organizationName:
          type: ["string", "null"]
        organizationLogoUrl:
          type: ["string", "null"]
        title:
          type: string
        description:
          type: ["string", "null"]
        coverImageUrl:
          type: ["string", "null"]
        heroImageUrl:
          type: ["string", "null"]
        accentColor:
          type: ["string", "null"]
        theme:
          type: string
          enum: [evenum, light, dark]
        status:
          type: string
          enum: [draft, active, ended]
        visibility:
          type: string
          enum: [public, private, invite_only]
        requiresAuth:
          type: boolean
        eligibilityMode:
          type: string
          enum: [open, allowlist]
        inviteCode:
          type: ["string", "null"]
        startsAt:
