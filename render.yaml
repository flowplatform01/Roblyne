services:
  - type: web
    name: roblyne-api
    runtime: node
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm run build:render:api
    startCommand: pnpm run migrate && node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/readyz
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PLATFORM_ADMIN_BOOTSTRAP_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_OAUTH_CLIENT_ID
        sync: false
      - key: MICROSOFT_OAUTH_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_OAUTH_TENANT
        sync: false
      - key: LINKEDIN_OAUTH_CLIENT_ID
        sync: false
      - key: LINKEDIN_OAUTH_CLIENT_SECRET
        sync: false
      - key: DISCORD_OAUTH_CLIENT_ID
        sync: false
      - key: DISCORD_OAUTH_CLIENT_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FLOWPAY_API_BASE_URL
        sync: false
      - key: FLOWPAY_CLIENT_ID
        sync: false
      - key: FLOWPAY_PUBLIC_KEY
        sync: false
      - key: FLOWPAY_SECRET_KEY
        sync: false
      - key: FLOWPAY_WEBHOOK_SECRET
        sync: false
      - key: FLOWPAY_PROVIDER
        sync: false
      - key: FLOWPAY_TIMEOUT_MS
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PUBLIC_BASE_URL
        sync: false

  - type: web
    name: roblyne-web
    runtime: static
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm run build:render:web
    staticPublishPath: artifacts/roblyne/dist/public
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: VITE_API_URL
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /campaigns/*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /events/*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /elections/*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /candidates/*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /organizations/*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /dashboard*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /login*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /register*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /password-reset*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /settings*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /admin*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /organizations/new*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /elections/new*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /events/new*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /campaigns/new*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /dev-payment/*
        name: X-Robots-Tag
        value: noindex, nofollow, noarchive
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: roblyne-worker
    runtime: node
    buildCommand: pnpm install --frozen-lockfile --prod=false && pnpm run build:render:worker
    startCommand: node --enable-source-maps artifacts/api-server/dist/worker.mjs
    healthCheckPath: /healthz
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: FLOWPAY_API_BASE_URL
        sync: false
      - key: FLOWPAY_CLIENT_ID
        sync: false
      - key: FLOWPAY_PUBLIC_KEY
        sync: false
      - key: FLOWPAY_SECRET_KEY
        sync: false
      - key: FLOWPAY_WEBHOOK_SECRET
        sync: false
      - key: FLOWPAY_PROVIDER
        sync: false
      - key: FLOWPAY_TIMEOUT_MS
        sync: false
